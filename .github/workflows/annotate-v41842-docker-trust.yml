name: Annotate historical Docker archive trust

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/annotate-v41842-docker-trust.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  annotate:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify existing archive digests and annotate Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v4.18.42" > "$RUNNER_TEMP/release.json"

          python3 - "$RUNNER_TEMP/release.json" "$RUNNER_TEMP/release-patch.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          source, destination = map(Path, sys.argv[1:])
          release = json.loads(source.read_text(encoding="utf-8"))
          assets = {asset["name"]: asset for asset in release["assets"]}
          expected = {
              "napcat-docker-v4.18.42-amd64.tar": (612216320, "sha256:85e3fd02b58fd836a0177734b6ff77a896000bcfcf209b3b200d7e8b8452df7c"),
              "napcat-docker-v4.18.42-arm64.tar": (597573632, "sha256:0d14594844e9135c760e710754a8778d98649de2ca837fce5a61b69b7d39954d"),
          }
          for name, (size, digest) in expected.items():
              item = assets.get(name)
              if item is None or item.get("size") != size or item.get("digest") != digest:
                  raise SystemExit(f"Refusing to annotate: {name} is absent or digest differs")

          start_marker = "<!-- historical-docker-archive-trust-v4.18.42:start -->"
          end_marker = "<!-- historical-docker-archive-trust-v4.18.42:end -->"
          annotation = """<!-- historical-docker-archive-trust-v4.18.42:start -->
          ## Docker 历史镜像归档与可信度说明

          这两个 tar **由 XingYunStar/NapCatQQ v4.18.42 Release 原样转存**，不是从 Docker Hub 直接下载，也不是我们重新构建的镜像。文件 SHA256 与原始归档一致；完整性校验不等于官方发布者身份认证。

          | Docker 归档 | 当前验证程度 | 说明 |
          | --- | --- | --- |
          | `napcat-docker-v4.18.42-amd64.tar` | **高可信度（未取得官方签名）** | SHA256、Docker 加载检查通过；Image ID、RootFS DiffID 与另一份可访问的华为云镜像副本一致。尚未与 Docker Hub 原始 Manifest 直接完成字节级比对。 |
          | `napcat-docker-v4.18.42-arm64.tar` | **完整性已验证，来源待独立确认** | SHA256、Docker 加载和内部层校验通过；因 Docker Hub 拒绝匿名拉取，未取得独立 arm64 镜像副本对照。 |

          **来源与核验记录：** [中文来源审计](https://github.com/FV4005-X/NapCatQQ/blob/main/.github/provenance/v4.18.42-release-provenance.md) · [Docker 核验 Actions](https://github.com/FV4005-X/NapCatQQ/actions/runs/43360816871) · [归档 Actions](https://github.com/FV4005-X/NapCatQQ/actions/runs/43367155443)。

          请勿把两份 tar 的文件 SHA256 与 Docker Hub 的 Manifest Digest 混同。
          <!-- historical-docker-archive-trust-v4.18.42:end -->""".replace("\n          ", "\n")

          base = release.get("body") or ""
          if start_marker in base and end_marker in base:
              prefix, remainder = base.split(start_marker, 1)
              _, suffix = remainder.split(end_marker, 1)
              new_body = prefix.rstrip() + "\n\n" + annotation + suffix
          elif start_marker in base or end_marker in base:
              raise SystemExit("Release has an incomplete existing annotation marker; refusing to modify")
          else:
              new_body = base.rstrip() + "\n\n" + annotation + "\n"

          destination.write_text(json.dumps({"body": new_body}, ensure_ascii=False), encoding="utf-8")
          print("Verified both archived Docker assets. Prepared idempotent Release description update.")
          PY

          release_id="$(jq -r '.id' "$RUNNER_TEMP/release.json")"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" --input "$RUNNER_TEMP/release-patch.json" > "$RUNNER_TEMP/release-after.json"
          jq -e '.body | contains("来源待独立确认")' "$RUNNER_TEMP/release-after.json"
          echo "Successfully annotated v4.18.42 Docker provenance without modifying Release assets."
